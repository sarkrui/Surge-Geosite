name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'surge-geosite-panel' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build panel
        run: pnpm panel:build

      - name: Deploy to Cloudflare Pages
        working-directory: packages/panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          deploy_output="$(
            npx wrangler pages deploy .svelte-kit/cloudflare \
              --project-name="${CLOUDFLARE_PAGES_PROJECT}" \
              --branch="${GITHUB_REF_NAME}" 2>&1
          )"
          deploy_status=$?
          printf '%s\n' "${deploy_output}"

          if [ "${deploy_status}" -ne 0 ]; then
            deploy_summary="$(
              printf '%s\n' "${deploy_output}" \
                | tail -n 20 \
                | tr '\n' ' ' \
                | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
            )"
            echo "::error::${deploy_summary}"
            exit "${deploy_status}"
          fi
